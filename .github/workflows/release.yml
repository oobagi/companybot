name: Release

# Runs when `pnpm release` pushes a v* tag. Builds, signs, and notarizes the Mac
# app, then publishes it to GitHub Releases, where the in-app updater finds it.

on:
  push:
    tags: ["v*"]

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Check tag matches app version
        run: |
          version=$(node -p "require('./src/desktop/package.json').version")
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match src/desktop/package.json version $version" >&2
            exit 1
          fi

      - name: Check signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing secrets: ${missing[*]}. Auto-update needs a signed, notarized app. See wiki/releases.md." >&2
            exit 1
          fi

      # Our own keychain instead of electron-builder's: its temporary keychain
      # fails to unlock on current macOS runners. Same method as GitHub's docs.
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -f pkcs12 -A -t cert
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application"

      - name: Build, sign, and notarize
        working-directory: src/desktop
        env:
          # Signs with the Developer ID now in the keychain.
          CSC_NAME: "Jaden Watson (792PGAG6C5)"
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # electron-builder wants a path to the .p8 key; the secret holds its contents.
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          chmod 600 "$APPLE_API_KEY"
          pnpm run package

      - name: Find release notes
        id: notes
        run: |
          file="release-notes/$GITHUB_REF_NAME.md"
          [[ -f "$file" ]] && echo "path=$file" >> "$GITHUB_OUTPUT" || echo "No $file; using the PR list only."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # Our notes (release-notes/<tag>.md, written with /release), then GitHub's PR list.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          # v1.2.0-alpha.1 → a GitHub prerelease. Only installs on a prerelease pick these up.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src/desktop/release/*.dmg
            src/desktop/release/*.zip
            src/desktop/release/*.blockmap
            src/desktop/release/*-mac.yml
          fail_on_unmatched_files: true

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
