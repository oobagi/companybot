name: CLA

# Outside contributors sign CLA.md once, by commenting on their pull request, so their
# code can ship in every edition (wiki/product.md). Signatures are stored on the
# cla-signatures branch, so signing doesn't run CI on main.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        # v2.6.1, pinned: the repo is archived but the release still works. It never checks out PR code.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/oobagi/companybot/blob/main/CLA.md
          branch: cla-signatures
          allowlist: oobagi,igaboo,*[bot]
