name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: App version
      description: Account settings → Your preferences → App.
      placeholder: 0.1.0-alpha.8
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Released app
        - Running from source
